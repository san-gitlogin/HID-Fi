[package]
name = "hidfi-core"
description = "HID-Fi companion: board protocol, pairing and discovery. No OS-specific code."
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.3.4"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "1.8.2"

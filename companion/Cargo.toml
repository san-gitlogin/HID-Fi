[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "4.0.3"
edition = "2021"
license-file = "../LICENSE.md"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# str0m with one fix from libwebrtc it does not port yet (vendor/str0m/PATCH.md):
# after an idle screen, the bandwidth estimate no longer collapses on WiFi.
[patch.crates-io]
str0m = { path = "vendor/str0m" }

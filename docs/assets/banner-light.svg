<!--
  README banner, light scheme. Geometry is identical to banner-dark.svg so the
  two swap without any shift; only the background and text colours change. The
  gradient tile is deliberately shared, so the mark itself looks the same in
  both themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-label="HID-Fi - a wireless trackpad, keyboard and media remote for any computer">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#3a7bd5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d2ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a7bd5" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3a7bd5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#ffffff"/>
  <ellipse cx="960" cy="20" rx="520" ry="300" fill="url(#glowA)"/>
  <ellipse cx="120" cy="300" rx="420" ry="260" fill="url(#glowB)"/>

  <rect x="96" y="84" width="132" height="132" rx="34" fill="url(#tile)"/>
  <g transform="translate(115.8 103.8) scale(3.3)"
     fill="none" stroke="#04121a" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.67 21.45A8.9 8.9 0 1 1 21.45 11.67"/>
    <path d="M8.64 8.64 14.96 20.66 15.7 15.7 20.66 14.96Z"
          fill="#04121a" stroke-width="1.5"/>
  </g>

  <text x="272" y="158" fill="#0b1620" letter-spacing="-1.5"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700">HID-Fi</text>
  <text x="276" y="204" fill="#44586a"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400">A wireless trackpad, keyboard and media remote for any computer.</text>
  <text x="276" y="238" fill="#6b7f8f"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400">No drivers, no agent, no admin rights on the machine you are driving.</text>
</svg>

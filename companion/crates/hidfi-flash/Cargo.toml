[package]
name = "hidfi-flash"
description = "HID-Fi: update a board over the cable - a closed ESP serial-protocol client, a journal with checkpoints, and a simulated ESP32-S3 to test every step against faults. No eFuse writes, by construction."
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[dependencies]
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
serialport = { version = "4.10.1", default-features = false, optional = true }

[features]
# The real serial port (the Companion). Tests run against the simulated chip.
serial = ["dep:serialport"]

[[example]]
name = "preflight"
required-features = ["serial"]

[[example]]
name = "cable_update"
required-features = ["serial"]

[[example]]
name = "loader_probe"
required-features = ["serial"]

[pytest]
# Run through `python tests/run.py` for the summary table, or `pytest tests` directly.
addopts = -ra --import-mode=importlib --strict-markers -p no:asyncio
testpaths = .
markers =
    static: needs only Python (and Node for the script syntax check)
    unit: firmware logic compiled on the host with a C++ compiler
    ui: drives the dashboard in a real browser (Playwright), no board
    build: compiles the firmware with arduino-cli
    hostsim: replays the firmware's exact keystrokes into a real Linux input stack (Xvfb + IBus + GTK), no board
    board: talks to a board on its COM port (opt in with --board)
    e2e: types/moves/clicks on THIS computer, into a focus-guarded test page (opt in with --e2e)
    linux: Linux-only end-to-end through evdev with the board's input devices grabbed
    perf: performance and soak measurements (opt in with --perf)
    slow: takes more than about a minute
    timing: timing-sensitive (speed measurements, live typing into IBus) - run.py runs these alone, after the parallel phase
    alone: heavy on the machine itself (the Companion window in two browser engines) - run.py runs these after the parallel phase, with the timing tests, so they never starve the dashboard's layout checks
    manual: needs a person or a real secret (never run automatically)

[package]
name = "hidfi-stream"
description = "HID-Fi companion: capture, encode and send the screen to a dashboard over WebRTC."
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[dependencies]
hidfi-core = { path = "../hidfi-core" }
hidfi-agent = { path = "../hidfi-agent" }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde_json = "1.0.154"
log = "0.4.34"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

# WebRTC's DTLS on each OS's own crypto: Apple's on macOS, CNG on Windows, and
# RustCrypto elsewhere. No C library to build on the platforms that have their own.
[target.'cfg(target_os = "macos")'.dependencies.str0m]
version = "0.24.1"
default-features = false
features = ["apple-crypto"]

[target.'cfg(windows)'.dependencies.str0m]
version = "0.24.1"
default-features = false
features = ["wincrypto"]

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies.str0m]
version = "0.24.1"
default-features = false
features = ["rust-crypto"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = ["SCStream", "SCShareableContent", "SCError", "block2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "dispatch2"] }

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
]

# Linux: X11 capture (pure Rust) and H.264 with Cisco's OpenH264, loaded at
# run time from the binary Cisco publishes (installed by the Linux installer),
# so the H.264 patent licence Cisco pays for covers it.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["damage", "xfixes"] }
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
